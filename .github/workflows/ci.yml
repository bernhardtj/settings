name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - run: bash -n bin/settings bin/settings-software lib/apply.sh lib/install.sh lib/software.sh install/actions/*.sh install/providers/*.sh setups/*/[0-9][0-9].*.sh

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - run: dnf install -y python3 bash just
      - run: just ci
